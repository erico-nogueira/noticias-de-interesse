name: Coleta diária de notícias

on:
  schedule:
    # 09:00 UTC = 06:00 em Brasília (UTC-3). O cron do GitHub sempre usa UTC.
    - cron: "0 9 * * *"
  workflow_dispatch: # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: read

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Coletar notícias e gravar no Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python scraper/collect.py
