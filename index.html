<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notícias de Interesse</title>
<meta name="description" content="Manchetes diárias de Pokémon competitivo (VGC, Smogon, Showdown), Pokémon em geral, ROM Hacks e outros jogos.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B0%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f4f5f9; --surface: #ffffff; --surface-2: #eef0f6; --text: #151a27; --muted: #5b6479;
    --border: #e1e4ee; --brand: #e3350d; --brand-2: #ff7a45; --on-brand: #ffffff;
    --shadow: 0 1px 2px rgba(20,26,40,.06), 0 4px 16px rgba(20,26,40,.06);
    --shadow-hover: 0 2px 4px rgba(20,26,40,.08), 0 10px 28px rgba(20,26,40,.14);
    --c-competitivo: #dc2626; --c-pokemon: #d97706; --c-jogos: #2563eb; --c-romhacks: #9333ea;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1117; --surface: #171b24; --surface-2: #212737; --text: #eceff6; --muted: #9ba5ba;
      --border: #262d3d; --brand: #ff5a3c; --brand-2: #ff9a62; --on-brand: #15110f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      --shadow-hover: 0 2px 4px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
      --c-competitivo: #f87171; --c-pokemon: #fbbf24; --c-jogos: #60a5fa; --c-romhacks: #c084fc;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1117; --surface: #171b24; --surface-2: #212737; --text: #eceff6; --muted: #9ba5ba;
    --border: #262d3d; --brand: #ff5a3c; --brand-2: #ff9a62; --on-brand: #15110f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.45);
    --c-competitivo: #f87171; --c-pokemon: #fbbf24; --c-jogos: #60a5fa; --c-romhacks: #c084fc;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Topo ---------- */
  .top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent);
         backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
         border-bottom: 1px solid var(--border); }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.01em; font-size: 1.1rem; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 1.1rem;
          background: linear-gradient(135deg, var(--brand), var(--brand-2)); box-shadow: var(--shadow); }
  .spacer { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
              background: var(--surface); display: grid; place-items: center; font-size: 1.05rem; }
  .icon-btn:hover { border-color: var(--brand); }

  .intro { padding: 28px 0 8px; }
  .intro h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.3rem); letter-spacing: -.03em; line-height: 1.15; }
  .intro p { margin: 8px 0 0; color: var(--muted); }
  .updated { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font-size: .85rem; color: var(--muted);
             background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.2); }

  /* ---------- Filtros ---------- */
  .filters { padding: 16px 0 4px; display: grid; gap: 12px; }
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
         border: 1px solid var(--border); background: var(--surface); font-weight: 600; white-space: nowrap;
         transition: transform .15s, border-color .15s, background .15s; }
  .tab:hover { border-color: var(--accent, var(--brand)); transform: translateY(-1px); }
  .tab[aria-pressed="true"] { background: var(--accent, var(--brand)); border-color: var(--accent, var(--brand)); color: #fff; }
  .tab .n { font-size: .75rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .tab[aria-pressed="true"] .n { background: rgba(255,255,255,.25); color: #fff; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: transparent;
          font-size: .85rem; color: var(--muted); }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--surface-2); color: var(--text); border-color: var(--text); font-weight: 600; }

  .tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search { position: relative; flex: 1 1 260px; }
  .search input { width: 100%; padding: 10px 14px 10px 38px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
  .search input::placeholder { color: var(--muted); }
  .search span { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); opacity: .6; pointer-events: none; }
  .seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); }
  .seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 9px; font-size: .88rem; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
  select { padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }

  /* ---------- Lista ---------- */
  main { padding: 8px 0 56px; }
  .day { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 14px; }
  .day h2 { margin: 0; font-size: 1.15rem; letter-spacing: -.01em; text-transform: capitalize; }
  .day small { color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); }

  .card { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border);
          border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
          transition: transform .18s, box-shadow .18s, border-color .18s; animation: rise .4s both; }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--accent); }
  .media { aspect-ratio: 16 / 9; background: var(--surface-2); overflow: hidden; position: relative; }
  .media img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
  .card:hover .media img { transform: scale(1.04); }
  .ph { width: 100%; height: 100%; display: grid; place-items: center; font-size: 2.6rem;
        background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 38%, var(--surface)), color-mix(in srgb, var(--accent) 8%, var(--surface))); }
  .badge-new { position: absolute; top: 10px; left: 10px; background: var(--brand); color: var(--on-brand); font-size: .72rem; font-weight: 800;
               letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
  .body { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 16px; flex: 1; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .78rem; color: var(--muted); }
  .pill { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent);
          font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .card h3 { margin: 0; font-size: 1.02rem; line-height: 1.35; letter-spacing: -.005em; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a::after { content: ""; position: absolute; inset: 0; } /* o card inteiro é clicável */
  .card:hover h3 a { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--accent); }
  .sum { margin: 0; font-size: .9rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .foot { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: .8rem; color: var(--muted); }
  .read { font-weight: 700; color: var(--accent); }
  .lang { font-weight: 700; letter-spacing: .04em; }

  .skeleton { height: 300px; border-radius: 18px; border: 1px solid var(--border);
              background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%) 0 0 / 300% 100%;
              animation: shimmer 1.4s infinite linear; }
  .state { text-align: center; padding: 64px 16px; color: var(--muted); }
  .state .big { font-size: 2.6rem; }
  .state h2 { color: var(--text); margin: 8px 0 4px; }
  .btn { margin-top: 14px; padding: 10px 18px; border-radius: 12px; border: 0; font-weight: 700;
         background: var(--brand); color: var(--on-brand); }
  .btn.ghost { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .more { display: flex; justify-content: center; margin-top: 28px; }
  footer { border-top: 1px solid var(--border); padding: 22px 0 36px; text-align: center; color: var(--muted); font-size: .82rem; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { to { background-position: -300% 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
  @media (max-width: 600px) {
    .wrap { padding: 0 16px; }
    .grid { grid-template-columns: 1fr; }
    .tools { gap: 8px; }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; white-space: nowrap; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="logo" aria-hidden="true">📰</span> Notícias de Interesse</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">🌙</button>
  </div>
</header>

<div class="wrap">
  <section class="intro">
    <h1>O que está rolando hoje</h1>
    <p>Pokémon competitivo, Pokémon em geral, ROM Hacks e outros jogos, reunidos em um só lugar.</p>
    <span class="updated" id="updated"><span class="dot"></span><span id="updated-text">Carregando…</span></span>
  </section>

  <section class="filters" aria-label="Filtros">
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
    <div class="chips" id="topics" aria-label="Assuntos"></div>
    <div class="tools">
      <label class="search"><span aria-hidden="true">🔎</span>
        <input type="search" id="q" placeholder="Buscar nas manchetes…" aria-label="Buscar nas manchetes" autocomplete="off">
      </label>
      <div class="seg" id="lang" role="group" aria-label="Idioma">
        <button type="button" data-v="" aria-pressed="true">Todos</button>
        <button type="button" data-v="pt" aria-pressed="false">PT</button>
        <button type="button" data-v="en" aria-pressed="false">EN</button>
      </div>
      <select id="period" aria-label="Período">
        <option value="all">Todo o período</option>
        <option value="today">Só hoje</option>
        <option value="week">Últimos 7 dias</option>
      </select>
    </div>
  </section>

  <main id="list" aria-live="polite"></main>
</div>

<footer>
  <div class="wrap">Guardamos só título, resumo e link: cada manchete leva ao site original da fonte.</div>
</footer>

<script>
  // Dados públicos do projeto Supabase (a publishable key é pública por design;
  // a segurança vem das regras RLS do banco, que só permitem LER artigos).
  const SUPABASE_URL = "https://jmtilwonagmjscweimow.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_9bhy-7ekWu7rsuARzQbAwA_vgc6UJNw";

  const SECTIONS = [
    { id: "", label: "Tudo", emoji: "✨", color: "var(--brand)" },
    { id: "competitivo", label: "Pokémon Competitivo", emoji: "⚔️", color: "var(--c-competitivo)" },
    { id: "pokemon", label: "Pokémon Geral", emoji: "⚡", color: "var(--c-pokemon)" },
    { id: "jogos", label: "Outros Jogos", emoji: "🎮", color: "var(--c-jogos)" },
    { id: "romhacks", label: "ROM Hacks", emoji: "🛠️", color: "var(--c-romhacks)" },
  ];
  const SECTION_BY_ID = Object.fromEntries(SECTIONS.map((s) => [s.id, s]));
  const TOPIC_EMOJI = {
    "VGC": "🏆", "Showdown": "💥", "Smogon": "📊", "Notícias gerais": "📰",
    "Forza Horizon": "🏎️", "Mario Kart": "🍄", "Mario Kart Wii": "🍄", "Fortnite": "🪂",
    "Brawl Stars": "⭐", "Rocket League": "🚀", "ROM Hacks": "🛠️",
  };
  const PAGE = 24;
  const state = { items: [], section: "", topic: "", lang: "", period: "all", q: "", shown: PAGE, status: "loading" };
  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const c of [].concat(children)) if (c != null) node.append(c);
    return node;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* sem armazenamento: tudo bem */ } },
  };
  const safeUrl = (u) => { try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : null; } catch { return null; } };

  function ago(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (mins < 2) return "agora";
    if (mins < 60) return `há ${mins} min`;
    const h = Math.round(mins / 60);
    if (h < 24) return `há ${h} h`;
    const d = Math.round(h / 24);
    return d === 1 ? "ontem" : `há ${d} dias`;
  }
  const dayKey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
  function dayLabel(iso) {
    const d = new Date(iso), now = new Date();
    const full = d.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    if (dayKey(iso) === dayKey(now)) return ["Hoje", full];
    if (dayKey(iso) === dayKey(new Date(now - 864e5))) return ["Ontem", full];
    return [full, ""];
  }
  // Google News termina o título com " - Nome do site"; já mostramos o site separado.
  function cleanTitle(a) {
    const suffix = a.publisher ? ` - ${a.publisher}` : "";
    return suffix && a.title.endsWith(suffix) ? a.title.slice(0, -suffix.length) : a.title;
  }

  /* ---------- Tema ---------- */
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute("data-theme", t);
    const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("theme").textContent = dark ? "☀️" : "🌙";
  }
  $("theme").onclick = () => {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
      (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = isDark ? "light" : "dark";
    store.set("theme", next); applyTheme(next);
  };
  applyTheme(store.get("theme"));

  /* ---------- Dados ---------- */
  async function load() {
    state.status = "loading"; render();
    const url = `${SUPABASE_URL}/rest/v1/articles` +
      `?select=id,title,summary,url,image_url,publisher,language,section,topic,published_at,collected_at` +
      `&order=published_at.desc&limit=500`;
    try {
      const res = await fetch(url, { headers: { apikey: SUPABASE_PUBLISHABLE_KEY } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.items = await res.json();
      state.status = "ready";
      const last = state.items.reduce((m, a) => (a.collected_at > m ? a.collected_at : m), "");
      $("updated-text").textContent = last ? `Atualizado ${ago(last)} · ${state.items.length} notícias` : "Sem notícias ainda";
    } catch (err) {
      state.status = "error"; state.error = err.message;
      $("updated-text").textContent = "Não foi possível atualizar";
    }
    render();
  }

  /* ---------- Filtros ---------- */
  function matches(a, { ignoreSection = false, ignoreTopic = false } = {}) {
    if (!ignoreSection && state.section && a.section !== state.section) return false;
    if (!ignoreTopic && state.topic && a.topic !== state.topic) return false;
    if (state.lang && a.language !== state.lang) return false;
    if (state.period === "today" && dayKey(a.published_at) !== dayKey(new Date())) return false;
    if (state.period === "week" && Date.now() - new Date(a.published_at) > 7 * 864e5) return false;
    const q = state.q.trim().toLowerCase();
    return !q || a.title.toLowerCase().includes(q) || (a.summary || "").toLowerCase().includes(q);
  }

  function renderControls() {
    $("tabs").replaceChildren(...SECTIONS.map((s) => {
      const count = state.items.filter((a) => (!s.id || a.section === s.id) && matches(a, { ignoreSection: true, ignoreTopic: true })).length;
      const b = el("button", { className: "tab", type: "button" },
        [el("span", { textContent: s.emoji }), el("span", { textContent: s.label }),
         ...(state.status === "ready" ? [el("span", { className: "n", textContent: String(count) })] : [])]);
      b.style.setProperty("--accent", s.color);
      b.setAttribute("aria-pressed", String(state.section === s.id));
      b.onclick = () => { state.section = s.id; state.topic = ""; state.shown = PAGE; render(); };
      return b;
    }));
    const inSection = state.items.filter((a) => matches(a, { ignoreTopic: true }));
    const topics = [...new Set(inSection.map((a) => a.topic).filter(Boolean))].sort();
    $("topics").replaceChildren(...topics.map((t) => {
      const b = el("button", { className: "chip", type: "button", textContent: `${TOPIC_EMOJI[t] || "•"} ${t}` });
      b.setAttribute("aria-pressed", String(state.topic === t));
      b.onclick = () => { state.topic = state.topic === t ? "" : t; state.shown = PAGE; render(); };
      return b;
    }));
    for (const b of $("lang").children) b.setAttribute("aria-pressed", String(b.dataset.v === state.lang));
  }

  /* ---------- Cartão ---------- */
  function card(a, i) {
    const sec = SECTION_BY_ID[a.section] || SECTION_BY_ID[""];
    const isNew = Date.now() - new Date(a.published_at) < 864e5;
    const href = safeUrl(a.url) || "#";
    const media = el("div", { className: "media" });
    const ph = el("div", { className: "ph", textContent: TOPIC_EMOJI[a.topic] || sec.emoji });
    ph.setAttribute("aria-hidden", "true");
    media.append(ph);
    const imgUrl = a.image_url && safeUrl(a.image_url);
    if (imgUrl) {
      const img = el("img", { src: imgUrl, alt: "", loading: "lazy", decoding: "async" });
      img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove();
      media.prepend(img);
    }
    if (isNew) media.append(el("span", { className: "badge-new", textContent: "Novo" }));

    const link = el("a", { href, target: "_blank", rel: "noopener noreferrer", textContent: cleanTitle(a) });
    const body = el("div", { className: "body" }, [
      el("div", { className: "meta" }, [
        el("span", { className: "pill", textContent: a.topic || sec.label }),
        el("span", { textContent: a.publisher || "" }),
        el("span", { textContent: `· ${ago(a.published_at)}` }),
      ]),
      el("h3", {}, link),
      ...(a.summary ? [el("p", { className: "sum", textContent: a.summary })] : []),
      el("div", { className: "foot" }, [
        el("span", { className: "lang", textContent: a.language === "pt" ? "🇧🇷 PT" : "🇺🇸 EN" }),
        el("span", { className: "read", textContent: "Ler notícia ↗" }),
      ]),
    ]);
    const node = el("article", { className: "card" }, [media, body]);
    node.style.setProperty("--accent", sec.color);
    node.style.animationDelay = `${Math.min(i, 12) * 30}ms`;
    return node;
  }

  /* ---------- Render ---------- */
  function stateBox(emoji, title, text, button) {
    const box = el("div", { className: "state" }, [el("div", { className: "big", textContent: emoji }),
      el("h2", { textContent: title }), el("div", { textContent: text })]);
    if (button) box.append(el("div", {}, button));
    return box;
  }

  function render() {
    renderControls();
    const list = $("list");

    if (state.status === "loading") {
      list.replaceChildren(el("div", { className: "grid" }, Array.from({ length: 6 }, () => el("div", { className: "skeleton" }))));
      return;
    }
    if (state.status === "error") {
      const retry = el("button", { className: "btn", type: "button", textContent: "Tentar de novo" });
      retry.onclick = load;
      list.replaceChildren(stateBox("🔌", "Não consegui carregar as notícias",
        `Verifique sua conexão e tente de novo. (${state.error})`, retry));
      return;
    }

    const rows = state.items.filter((a) => matches(a));
    if (!rows.length) {
      const clear = el("button", { className: "btn ghost", type: "button", textContent: "Limpar filtros" });
      clear.onclick = () => {
        Object.assign(state, { section: "", topic: "", lang: "", period: "all", q: "", shown: PAGE });
        $("q").value = ""; $("period").value = "all"; render();
      };
      list.replaceChildren(stateBox("🔍", "Nada por aqui",
        state.items.length ? "Nenhuma notícia combina com esses filtros." : "A primeira coleta ainda não gravou notícias.",
        state.items.length ? clear : null));
      return;
    }

    const visible = rows.slice(0, state.shown);
    const out = [];
    let group = null, grid = null, idx = 0;
    for (const a of visible) {
      const key = dayKey(a.published_at);
      if (key !== group) {
        group = key;
        const [title, sub] = dayLabel(a.published_at);
        out.push(el("div", { className: "day" }, [el("h2", { textContent: title }), ...(sub ? [el("small", { textContent: sub })] : [])]));
        grid = el("div", { className: "grid" });
        out.push(grid);
      }
      grid.append(card(a, idx++));
    }
    if (rows.length > visible.length) {
      const more = el("button", { className: "btn ghost", type: "button", textContent: `Mostrar mais (${rows.length - visible.length})` });
      more.onclick = () => { state.shown += PAGE; render(); };
      out.push(el("div", { className: "more" }, more));
    }
    list.replaceChildren(...out);
  }

  /* ---------- Eventos ---------- */
  let timer;
  $("q").addEventListener("input", (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 150);
  });
  $("lang").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.lang = b.dataset.v; store.set("lang", state.lang); state.shown = PAGE; render();
  });
  $("period").addEventListener("change", (e) => { state.period = e.target.value; state.shown = PAGE; render(); });

  const savedLang = store.get("lang");
  if (savedLang === "pt" || savedLang === "en") state.lang = savedLang;
  load();
</script>
</body>
</html>
