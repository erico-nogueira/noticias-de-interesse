<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notícias de Interesse</title>
<meta name="description" content="Manchetes diárias: Pokémon competitivo (VGC, Smogon, Showdown), notícias de Pokémon, ROM Hacks e outros jogos.">
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1b1f2a; --muted: #5d6579;
    --border: #e1e4ee; --accent: #e3350d; --accent-text: #ffffff; --chip: #eceff7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1218; --card: #181c25; --text: #e9ecf3; --muted: #9aa3b8;
            --border: #272d3b; --accent: #ff5a3c; --accent-text: #111; --chip: #222837; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.45; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 28px 0 12px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { color: var(--muted); margin: 4px 0 0; font-size: .95rem; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 8px; }
  button, input, select { font: inherit; color: inherit; }
  .tab, .chip { border: 1px solid var(--border); background: var(--card); padding: 7px 14px;
                border-radius: 999px; cursor: pointer; }
  .chip { background: var(--chip); padding: 4px 11px; font-size: .85rem; }
  .tab[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-text);
                border-color: var(--accent); font-weight: 600; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  input[type="search"], select { border: 1px solid var(--border); background: var(--card);
                padding: 8px 12px; border-radius: 10px; }
  input[type="search"] { flex: 1 1 200px; }
  .grid { display: grid; gap: 12px; }
  .card { display: flex; gap: 14px; background: var(--card); border: 1px solid var(--border);
          border-radius: 14px; padding: 14px; text-decoration: none; color: inherit; }
  .card:hover { border-color: var(--accent); }
  .thumb { width: 112px; height: 84px; object-fit: cover; border-radius: 10px; flex: none; background: var(--chip); }
  .meta { color: var(--muted); font-size: .82rem; display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 4px; }
  .tag { background: var(--chip); border-radius: 6px; padding: 0 7px; }
  .new { background: var(--accent); color: var(--accent-text); }
  .title { margin: 0 0 4px; font-size: 1.05rem; font-weight: 650; }
  .sum { margin: 0; color: var(--muted); font-size: .9rem;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .state { text-align: center; color: var(--muted); padding: 40px 12px; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 28px; }
  @media (max-width: 520px) { .thumb { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Notícias de Interesse</h1>
    <p class="sub">Pokémon competitivo, Pokémon em geral, ROM Hacks e outros jogos – atualizado todo dia às 6h.</p>
  </header>

  <nav class="bar" id="tabs" aria-label="Seções"></nav>
  <div class="bar" id="topics" aria-label="Assuntos"></div>

  <div class="tools">
    <input type="search" id="q" placeholder="Buscar nas manchetes…" aria-label="Buscar">
    <select id="lang" aria-label="Idioma">
      <option value="">Todos os idiomas</option>
      <option value="pt">Português</option>
      <option value="en">English</option>
    </select>
  </div>

  <main id="list" class="grid" aria-live="polite"><div class="state">Carregando notícias…</div></main>
  <footer>Clique em uma manchete para abrir a notícia original no site da fonte.</footer>
</div>

<script>
  // ▼▼▼ COLE AQUI os dados do SEU projeto Supabase (Project Settings > API Keys) ▼▼▼
  const SUPABASE_URL = https://jmtilwonagmjscweimow.supabase.co/rest/v1/;            // ex.: https://abcdxyz.supabase.co
  const SUPABASE_PUBLISHABLE_KEY = sb_publishable_9bhy-7ekWu7rsuARzQbAwA_vgc6UJNw; // ex.: sb_publishable_...
  // ▲▲▲ A publishable key é pública por design; a segurança vem das regras (RLS) do banco. ▲▲▲

  const SECTIONS = [
    { id: "", label: "Tudo" },
    { id: "competitivo", label: "Pokémon Competitivo" },
    { id: "pokemon", label: "Pokémon Geral" },
    { id: "jogos", label: "Outros Jogos" },
    { id: "romhacks", label: "ROM Hacks" },
  ];
  const state = { items: [], section: "", topic: "", lang: "", q: "" };
  const $ = (id) => document.getElementById(id);

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const c of [].concat(children)) node.append(c);
    return node;
  }

  function ago(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
    if (mins < 60) return `há ${mins} min`;
    const h = Math.round(mins / 60);
    if (h < 24) return `há ${h} h`;
    const d = Math.round(h / 24);
    return d === 1 ? "ontem" : `há ${d} dias`;
  }

  function safeUrl(u) {
    try { const p = new URL(u); return /^https?:$/.test(p.protocol) ? p.href : null; } catch { return null; }
  }

  async function load() {
    if (SUPABASE_URL.startsWith("COLE_AQUI")) {
      $("list").replaceChildren(el("div", { className: "state",
        textContent: "Falta configurar o SUPABASE_URL e a SUPABASE_PUBLISHABLE_KEY no começo do index.html." }));
      return;
    }
    const url = `${SUPABASE_URL}/rest/v1/articles` +
      `?select=id,title,summary,url,image_url,publisher,language,section,topic,published_at` +
      `&order=published_at.desc&limit=400`;
    try {
      const res = await fetch(url, { headers: { apikey: SUPABASE_PUBLISHABLE_KEY } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.items = await res.json();
      render();
    } catch (err) {
      $("list").replaceChildren(el("div", { className: "state",
        textContent: `Não foi possível carregar as notícias (${err.message}). Confira a URL, a chave e a policy de leitura.` }));
    }
  }

  function renderControls() {
    $("tabs").replaceChildren(...SECTIONS.map((s) => {
      const b = el("button", { className: "tab", textContent: s.label, type: "button" });
      b.setAttribute("aria-pressed", String(state.section === s.id));
      b.onclick = () => { state.section = s.id; state.topic = ""; render(); };
      return b;
    }));
    const inSection = state.items.filter((a) => !state.section || a.section === state.section);
    const topics = [...new Set(inSection.map((a) => a.topic).filter(Boolean))].sort();
    $("topics").replaceChildren(...topics.map((t) => {
      const b = el("button", { className: "chip", textContent: t, type: "button" });
      b.setAttribute("aria-pressed", String(state.topic === t));
      b.onclick = () => { state.topic = state.topic === t ? "" : t; render(); };
      return b;
    }));
  }

  function render() {
    renderControls();
    const q = state.q.trim().toLowerCase();
    const rows = state.items.filter((a) =>
      (!state.section || a.section === state.section) &&
      (!state.topic || a.topic === state.topic) &&
      (!state.lang || a.language === state.lang) &&
      (!q || a.title.toLowerCase().includes(q) || (a.summary || "").toLowerCase().includes(q)));

    if (!rows.length) {
      $("list").replaceChildren(el("div", { className: "state", textContent: "Nenhuma notícia encontrada para este filtro." }));
      return;
    }
    $("list").replaceChildren(...rows.slice(0, 150).map((a) => {
      const href = safeUrl(a.url);
      const isNew = Date.now() - new Date(a.published_at) < 36e5 * 24;
      const meta = el("div", { className: "meta" }, [
        ...(isNew ? [el("span", { className: "tag new", textContent: "Hoje" })] : []),
        el("span", { className: "tag", textContent: a.topic || a.section }),
        el("span", { textContent: a.publisher || "" }),
        el("span", { textContent: a.language === "pt" ? "PT" : "EN" }),
        el("span", { textContent: ago(a.published_at) }),
      ]);
      const body = el("div", {}, [meta, el("h2", { className: "title", textContent: a.title }),
        ...(a.summary ? [el("p", { className: "sum", textContent: a.summary })] : [])]);
      const card = el("a", { className: "card", href: href || "#", target: "_blank", rel: "noopener noreferrer" });
      if (a.image_url && safeUrl(a.image_url)) {
        const img = el("img", { className: "thumb", src: safeUrl(a.image_url), alt: "", loading: "lazy" });
        img.referrerPolicy = "no-referrer";
        img.onerror = () => img.remove();
        card.append(img);
      }
      card.append(body);
      return card;
    }));
  }

  $("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
  $("lang").addEventListener("change", (e) => { state.lang = e.target.value; render(); });
  renderControls();
  load();
</script>
</body>
</html>
